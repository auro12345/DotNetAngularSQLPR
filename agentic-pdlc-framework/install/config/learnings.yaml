  #    check for Figma links even when the ticket description doesn't mention them"

  development: []
  # - "Run `npm run db:seed` before running integration tests locally"
  # - "The OrderRepository.findByStatus() has a known bug (PROJ-456) — avoid it
  #    until that ticket is resolved; use findByStatusRaw() as a workaround"

  review: []
  # - "Any change to src/payments/** needs an explicit note confirming PCI scope
  #    was considered — add this as a PR comment"
  # - "Database migrations must always be backwards-compatible; we use blue-green
  #    deploys and two versions of the app run simultaneously during rollout"

  testing: []
  # - "Prefer Playwright E2E for the checkout flow — unit tests have historically
  #    missed integration issues between cart and payment modules"
  # - "Use the `createAuthenticatedClient()` factory for all auth-related tests;
  #    don't construct tokens manually"

  architecture: []
  # - "New modules must follow the feature-folder structure in src/features/;
  #    do not create top-level service files outside feature folders"

  maintenance: []
  # - "The weekly dependency audit should skip @internal/* packages — they are
  #    vendored and managed separately by the platform team"

# ─────────────────────────────────────────────────────────
# PROCESS ADJUSTMENTS
# Change how the PDLC workflow runs for this project.
# ─────────────────────────────────────────────────────────
process:
  # Skip design doc for these ticket types (just go straight to implementation):
  skipDesignDocForTypes: []        # e.g., ["bug", "chore"]

  # Auto-autonomous mode (skip Jira clarification loop) for these Jira labels:
  autonomousOnLabels: []           # e.g., ["hotfix", "p0", "trivial"]

  # Skip code review for these file path patterns:
  skipReviewForPaths: []           # e.g., ["docs/**", "*.md", "*.txt"]

  # Always post Confluence release notes on merge (overrides per-ticket setting):
  alwaysPostReleaseNotes: false

  # Require a second human reviewer (on top of AI review) for these paths:
  requireHumanReviewForPaths: []   # e.g., ["src/payments/**", "src/auth/**"]

