# config/learnings.yaml
#
# Team-specific learnings that supplement and override framework defaults.
# This file grows over time as the team runs retrospectives and captures insights.
#
# HOW TO UPDATE:
#   /learn "description of what was learned"  — adds a single learning
#   /retro                                     — runs a retrospective and proposes batch updates
#   /health                                    — reports how well the team follows entries here
#
# HOW AGENTS USE THIS FILE:
#   All agents load this after config/project.yaml.
#   agentHints.*       → injected into the relevant agent's context
#   patterns.avoid     → treated as BLOCKER in code review
#   patterns.preferred → suggested in development and review
#   reviewOverrides    → override default thresholds from project.yaml
#   process.*          → change workflow behavior (skip steps, auto-modes)
#   techDebt           → surfaced by Maintenance Agent
#   postmortems        → context for Maintenance Agent and Review Agent
#
# IMPORTANT: Credentials never go here. Non-secret settings only.

version: 1
project: "your-project-name"   # matches config/project.yaml > project.name
lastUpdated: null
updatedBy: null

# ─────────────────────────────────────────────────────────
# CODE PATTERNS
# Team-agreed conventions beyond framework defaults.
# ─────────────────────────────────────────────────────────
patterns:
  preferred: []
  # Example entries (remove # to activate):
  #
  # - pattern: "Use Result<T, E> instead of throwing exceptions in service layer"
  #   reason: "Exceptions make control flow hard to test and trace"
  #   appliesTo: ["services", "repositories"]
  #   addedDate: "2025-01-15"
  #   source: "retro-2025-Q1"
  #
  # - pattern: "All API responses must use the ApiResponse<T> wrapper type"
  #   reason: "Inconsistent response shapes caused 2 frontend bugs in Q4 2024"
  #   appliesTo: ["controllers", "api handlers"]
  #   addedDate: "2025-01-15"
  #   source: "postmortem-PM-001"

  avoid: []
  # Example entries:
  #
  # - pattern: "Never use `any` in TypeScript, including test files"
  #   reason: "Masked a type mismatch that caused a P1 incident (PM-002)"
  #   severity: blocker    # blocker | warning | suggestion
  #   addedDate: "2025-01-15"
  #   source: "postmortem-PM-002"
  #
  # - pattern: "Don't call Prisma directly from controllers — go through service layer"
  #   reason: "Bypassing service layer skips auth checks and validation"
  #   severity: blocker
  #   addedDate: "2025-01-15"
  #   source: "retro-2025-Q1"

# ─────────────────────────────────────────────────────────
# REVIEW OVERRIDES
# Adjust default code review thresholds for this project.
# Values here override config/project.yaml > codingStandards.*
# ─────────────────────────────────────────────────────────
reviewOverrides:
  # maxFunctionLines: 15          # relax from default 10 for this team
  # maxFileLines: 400             # relax from default 300
  # coverageThresholds:
  #   statements: 75              # relax from default 80 for legacy areas

  skipForPaths: []
  # Paths where normal review rules are relaxed:
  # - "migrations/**"             # DB migrations can be longer
  # - "**/*.generated.ts"         # generated files exempt from style rules
  # - "scripts/**"                # one-off scripts exempt from coverage

  extraSecurityPaths: []
  # Paths that always trigger a deeper security check:
  # - "src/payments/**"
  # - "src/auth/**"

# ─────────────────────────────────────────────────────────
# AGENT HINTS
# Additional context injected into specific agents.
# Use these to give agents knowledge that isn't in the code.
# ─────────────────────────────────────────────────────────
