# ──────────────────────────────────────────────
# CODING STANDARDS
# ──────────────────────────────────────────────
codingStandards:
  maxFunctionLines: 10           # Maximum lines per function/method
  maxCyclomaticComplexity: 8    # Maximum complexity score per function
  maxFileLines: 300             # Maximum lines per source file
  maxClassMethods: 10           # Maximum methods per class

  conventions:
    componentStyle: functional  # functional | class (for React/Vue)
    importStyle: named          # named | default | mixed
    namingConvention: camelCase # camelCase | snake_case | PascalCase (for variables/functions)
    fileNaming: kebab-case      # kebab-case | camelCase | PascalCase
    testStyle: colocated        # colocated | separate-folder
    organizationPattern: featureBased  # featureBased | layerBased | domainBased

  patterns:
    # List architectural patterns in use (agents follow these for new code)
    # e.g., - Repository Pattern
    #       - Service Layer
    #       - CQRS
    #       - Event-driven
    - "TODO: list patterns"

  prohibitedPatterns:
    # Patterns to NEVER use in this project
    # e.g., - "No class components (React)"
    #       - "No direct database access from controllers"
    - "TODO: list prohibited patterns"

# ──────────────────────────────────────────────
# TESTING CONFIGURATION
# ──────────────────────────────────────────────
testing:
  coverageThresholds:
    statements: 80
    branches: 75
    functions: 85
    lines: 80

  # Folders/patterns to exclude from coverage
  coverageExcludes:
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/generated/**"
    - "**/migrations/**"
    - "**/node_modules/**"

  # E2E test configuration
  e2e:
    enabled: false
    baseUrl: "http://localhost:3000"
    headless: true

# ──────────────────────────────────────────────
# INTEGRATIONS (fill in manually)
# ──────────────────────────────────────────────
integrations:
  jira:
    enabled: false
    baseUrl: "TODO: https://your-org.atlassian.net"
    projectKey: "TODO: e.g., PROJ"
    # Auth: set JIRA_API_TOKEN and JIRA_USER_EMAIL env vars

  git:
    provider: github  # github | gitlab | bitbucket | azure-devops
    owner: "TODO: org or username"
    repo: "TODO: repository name"
    defaultBranch: main  # main | master | develop
    mergeStrategy: squash  # squash | rebase | merge
    requireLinearHistory: true
    requireSignedCommits: false
    prTemplate: null  # path to PR template, null = use PDLC default

  monitoring:
    enabled: false
    provider: null  # datadog | newrelic | sentry | grafana | cloudwatch | none
    dashboardUrl: null
    alertsSlackChannel: null

  confluence:
    enabled: false
    baseUrl: "TODO: https://your-org.atlassian.net/wiki"
    spaceKey: "TODO: e.g., PROJ"
    releaseNotesParent: null    # Page ID for release notes parent page
    designDocsParent: null      # Page ID for design documents parent
    apiDocsParent: null         # Page ID for API documentation parent
    healthDashboardPage: null   # Page ID for health dashboard
    adrParent: null             # Page ID for Architecture Decision Records
    # Auth: CONFLUENCE_API_TOKEN, CONFLUENCE_USER_EMAIL, CONFLUENCE_BASE_URL env vars
    # Get page IDs: open page → ••• → Page Information → ID in URL

  notifications:
    onDeployment: false
    channel: null        # Slack channel ID (e.g., C0XXXXXXXXX) for deployment notifications
    alertsChannel: null  # Slack channel for maintenance alerts and health issues

# ──────────────────────────────────────────────
# DEPLOYMENT CONFIGURATION
# ──────────────────────────────────────────────
deployment:
  environments:
    development:
      url: "http://localhost:3000"
      deployCommand: null  # runs locally
    staging:
      url: "TODO: https://staging.your-app.com"
      deployCommand: "TODO: e.g., vercel --prebuilt"
      autoDeployOnMerge: true
      branch: main
    production:
      url: "TODO: https://your-app.com"
      deployCommand: "TODO: e.g., vercel --prod --prebuilt"
      autoDeployOnMerge: false  # require manual approval
      branch: main
      requireApproval: true

  releaseStrategy: continuous  # continuous | tagged | manual
  versioningScheme: semver     # semver | calver | none
  changelogFormat: keepachangelog  # keepachangelog | conventional-changelog | none

# ──────────────────────────────────────────────
# MAINTENANCE SETTINGS
# ──────────────────────────────────────────────
maintenance:
  dependencyUpdateSchedule: monthly  # weekly | monthly | quarterly
  securityAuditSchedule: weekly
  techDebtReviewSchedule: monthly

  licensing:
    allowed:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - CC0-1.0
    restricted:
      - GPL-2.0
      - GPL-3.0
    blocked:
      - UNLICENSED
      - UNKNOWN
